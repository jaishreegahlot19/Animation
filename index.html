<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 11 | Web Programming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        body {
            height: 100vh;
            /* background-color: grey; */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .con {
            background-color: white;
            height: 80%;
            width: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
        .small-boxes {
            display: flex;
            gap: 20px;
        }
        .box {
            height: 100px;
            width: 100px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        .b1 {
            background-color: red;
            animation: color-box 1.5s ease-in-out infinite;
        }
        .b2 {
            background-color: purple;
            animation: move-box 1.1s ease-in-out infinite;
        }
        .b3 {
            background-color: green;
            animation: rotate-box 1.1s ease-in-out infinite;
        }
        .b4 {
            background-color: crimson;
            animation: pulse-box 1.1s ease-in-out infinite;
        }
        .b5 {
            background-color: grey;
            animation: fade-box 1.1s ease-in-out infinite;
        }
        .b6 {
            border: 15px solid lightgrey;
            border-top: 15px solid blue;
            border-radius: 50%;
            animation: load-box 0.8s linear infinite;
        }

        @keyframes color-box {
            0% { background-color: red; }
            50% { background-color: orange; }
            100% { background-color: red; }
        }
        @keyframes move-box {
            0% { transform: translateY(-10px);}
            50% { transform: translateY(10px);}
            100% { transform: translateY(-10px);}
        }
        @keyframes rotate-box {
            0% { transform: rotate(-15deg); }
            50% { transform: rotate(15deg); }
            100% { transform: rotate(-15deg); }
        }
        @keyframes pulse-box {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.9); }
        }
        @keyframes fade-box {
            0% { opacity: 1;}
            50% { opacity: 0.7;}
            100% { opacity: 1;}
        }
        @keyframes load-box {
            from { transform: rotate(0deg);}
            to { transform: rotate(360deg);}
        }

        .big-box {
            height: 300px;
            width: 300px;
            border: 2px dashed black;
            overflow: hidden;
        }
        .b7 {
            height: 80px;
            width: 80px;
            background-color: green;
            animation: walk-box 3s ease-in-out infinite;
        }

        @keyframes walk-box {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(220px, 0px); }
            50% { transform: translate(220px, 220px); }
            75% { transform: translate(0px, 220px); }
            100% { transform: translate(0px, 0px); }
        }

        .google {
            display: flex;
            gap: 5px;
        }
        .dot {
            border-radius: 50%;
            height: 30px;
            width: 30px;
            animation: jiggle 0.4s cubic-bezier(1, 0.35, 0.65, 1) infinite;
        }
        .box2 {
            display: flex;
            gap: 50px;
        }
        .g {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes jiggle {
            0% { transform: translateY(0px);}
            25% { transform: translateY(-6px);}
            50% { transform: translateY(0px);}
            75% { transform: translateY(6px);}
            100% { transform: translateY(0px);}
        }
    </style>
</head>
<body>
    <div class="con">
        <h1>CSS Animation Examples</h1>
        <div class="small-boxes">
            <div class="box b1">Color</div>
            <div class="box b2">Move</div>
            <div class="box b3">Rotate</div>
            <div class="box b4">Pulse</div>
            <div class="box b5">Fade</div>
            <div class="box b6"></div>
        </div>
        <div class="box2">
            <div class="big-box">
                <div class="b7"></div>
            </div>
            <div class="big-box g">
                <div class="google">
                    <div class="dot" style="background-color: red; animation-delay: 0.1s;"></div>
                    <div class="dot" style="background-color: yellow; animation-delay: 0.2s"></div>
                    <div class="dot" style="background-color: orange; animation-delay: 0.3s"></div>
                    <div class="dot" style="background-color: green; animation-delay: 0.4s"></div>
                    <div class="dot" style="background-color: blue; animation-delay: 0.5s"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
